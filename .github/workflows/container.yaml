name: Container
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment scripts
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            bin/production bin/production-backup bin/production-verify-restore \
            bin/production-storage-manifest bin/check-production-image \
            docker/rootfs/usr/local/bin/nafinity-entrypoint \
            docker/rootfs/usr/local/bin/nafinity-healthcheck
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/${{ matrix.arch }}
          tags: nafinity:ci
          load: true
          cache-from: type=gha,scope=production-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.arch }}
      - name: Clean production installation and restore check
        run: bin/check-production-image nafinity:ci
      - name: Scan production dependencies and OS packages
        run: |
          docker save --output /tmp/nafinity-image.tar nafinity:ci
          docker run --rm -v /tmp/nafinity-image.tar:/image.tar:ro \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress

  publish:
    needs: check
    if: >-
      github.repository == 'nafphp/nafinity' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify stable release belongs to main
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/nafphp/nafinity
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
          flavor: |
            latest=true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=production-amd64
            type=gha,scope=production-arm64
