name: Board integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      board_ref:
        description: Board commit or branch to exercise in this private host
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: nafinity
      - uses: actions/checkout@v7
        with:
          repository: nafphp/board
          ref: ${{ inputs.board_ref || 'f118c8f9f433e901c5f4390dfb079a52401377ce' }}
          path: nafphp/board
      - uses: actions/checkout@v7
        with:
          repository: nafphp/framework
          ref: 8c018baa1769fe174e029f7ae004438d9b7cc0cf
          path: nafphp/framework
      - uses: actions/checkout@v7
        with:
          repository: nafphp/cli
          ref: 2607ca452f288787a28074920e74da3a76d8e23e
          path: nafphp/cli
      - uses: actions/checkout@v7
        with:
          repository: nafphp/database
          ref: 2f50dbf7646974b22bd5d275f4d7ed3502983429
          path: nafphp/database
      - uses: actions/checkout@v7
        with:
          repository: nafphp/mcp
          ref: e75ee05b2f3f04e127df137a6c94ea095a346929
          path: nafphp/mcp
      - uses: actions/checkout@v7
        with:
          repository: nafphp/oauth-client
          ref: 7502c054f4a5c1545fb83e836cd32cd11f170acf
          path: nafphp/oauth-client
      - uses: actions/checkout@v7
        with:
          repository: nafphp/queue
          ref: a84d3a495eb1bed69768440b358dd845351a76a3
          path: nafphp/queue
      - uses: actions/checkout@v7
        with:
          repository: nafphp/rbac
          ref: f4aafba9fbe8ca8e133c0e9c4b18539c8995e565
          path: nafphp/rbac
      - uses: actions/checkout@v7
        with:
          repository: nafphp/schedule
          ref: cdf95d63ed5a1f6121e8f8ae15fb921abe78865f
          path: nafphp/schedule
      - uses: actions/checkout@v7
        with:
          repository: nafphp/websocket
          ref: 184fb372289958a7cfbe84b70f3c83d154127f06
          path: nafphp/websocket
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare the disposable Linux host
        working-directory: nafinity
        run: |
          make create-env-file certificates storage-dirs
          mkdir -p work
          chmod -R a+rwX app .test-storage work
          sudo chgrp 1000 docker/rootfs/etc/nginx/ssl/privkey.pem
          chmod 640 docker/rootfs/etc/nginx/ssl/privkey.pem
          umask 0000
          make build-app composer-install
      - name: Prove automatic ordering without a host plugin list
        working-directory: nafinity
        run: |
          test ! -e app/src/plugins.php
          test ! -e app/app/plugins.php
          umask 0000
          make test-up
          docker compose exec -T app-test php vendor/bin/naf plugins:debug
      - name: Run both databases, HTTP, workers and real Composer extensions
        working-directory: nafinity
        run: |
          set -o pipefail
          umask 0000
          make test 2>&1 | tee integration.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-results
          path: nafinity/integration.log
      - name: Diagnose failed services
        if: failure()
        working-directory: nafinity
        run: |
          docker compose --profile test ps -a
          docker compose --profile test logs --tail=100 app-test
          docker compose exec -T app-test nafinity-healthcheck || true
      - name: Remove disposable services
        if: always() && hashFiles('nafinity/compose.yaml') != ''
        working-directory: nafinity
        run: docker compose --profile test down --volumes
