name: nafinity
services:
  app:
    image: nafinity:dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    working_dir: /var/www
    environment:
      # APP_ENV deliberately absent: the application reads it from app/.env, which
      # is the file someone can edit. NAF's dotenv only fills gaps.
      APP_URL: https://localhost:${NAFINITY_HTTPS_PORT:-443}
      NAFINITY_BACKGROUND_ENABLED: "true"
      NAFINITY_MAIL_FROM: ${NAFINITY_MAIL_FROM:-notifications@example.test}
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nafinity
      DB_USERNAME: nafinity
      DB_PASSWORD: ${NAFINITY_DB_PASSWORD:?Copy .env.example to .env and set the database passwords}
      # Live updates over naf/websocket. Off unless an installation says otherwise;
      # the key signs connect tokens and belongs in .env, not here.
      WEBSOCKET_ENABLED: ${NAFINITY_WEBSOCKET_ENABLED:-false}
      WEBSOCKET_KEY: ${NAFINITY_WEBSOCKET_KEY:-}
      WEBSOCKET_URL: ${NAFINITY_WEBSOCKET_URL:-wss://localhost:8091}
    volumes:
      - ./app:/var/www
      - ./docker/rootfs/etc/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "127.0.0.1:${NAFINITY_PORT:-8088}:8080"
      - "127.0.0.1:${NAFINITY_HTTPS_PORT:-443}:8443"
      # naf/websocket listens on a port of its own rather than behind nginx, so
      # it needs one published. Nothing binds it unless websocket:enabled says so.
      - "127.0.0.1:${NAFINITY_WEBSOCKET_PORT:-8091}:8091"
    init: true
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ["127.0.0.1:${NAFINITY_MAILPIT_PORT:-8025}:8025"]
    environment:
      MP_MAX_MESSAGES: 500
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: nafinity
      MARIADB_USER: nafinity
      MARIADB_PASSWORD: ${NAFINITY_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${NAFINITY_DB_ROOT_PASSWORD:?Set a local root password}
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  database:
