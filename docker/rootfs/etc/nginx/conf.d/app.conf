server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;
    root   /var/www/public;
    index  index.php;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        same-origin always;
    add_header X-Frame-Options        DENY always;
    # A socket scheme is its own scheme to a content policy: `https://localhost:*`
    # does not permit `wss://localhost:8091`, and a browser that refuses one says
    # only "error". An installation that runs naf/websocket on another host has
    # to name it here too.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' http://localhost:* https://localhost:* http://127.0.0.1:* https://127.0.0.1:* ws://localhost:* wss://localhost:* ws://127.0.0.1:* wss://127.0.0.1:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ /\. {
        deny all;
    }

    # Served with an ETag but no Cache-Control, a static file falls to the
    # browser's own guess at how long it may keep it -- which is why an edited
    # stylesheet or module kept arriving as the version before it, whatever was
    # published. `no-cache` does not mean "do not store": the file is still
    # cached, the browser just asks first, and a 304 costs a round trip rather
    # than the file. The alternative is a hashed name per build, which this
    # application does not have.
    location /assets/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.php?$query_string;
    }

    location /plugins/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include       fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass  127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }
}

server {
    listen 8080;

    include /tmp/nginx/redirect.conf;
}
